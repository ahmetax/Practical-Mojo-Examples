<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MojoChat</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1d2e;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #16213e;
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2d3561;
      flex-shrink: 0;
    }

    header h1 { font-size: 1.2rem; color: #818cf8; font-weight: 700; }
    header h1 span { color: #e2e8f0; }

    .header-info { font-size: 0.82rem; color: #64748b; }

    /* ── Login overlay ── */
    #login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26,29,46,0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .login-card {
      background: #16213e;
      border: 1px solid #2d3561;
      border-radius: 16px;
      padding: 2.5rem;
      width: 340px;
      text-align: center;
    }

    .login-card h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #818cf8;
      margin-bottom: 0.5rem;
    }

    .login-card p {
      color: #64748b;
      font-size: 0.88rem;
      margin-bottom: 1.5rem;
    }

    .login-card input {
      width: 100%;
      padding: 0.7rem 1rem;
      background: #1a1d2e;
      border: 1px solid #2d3561;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 1rem;
      transition: border 0.2s;
    }

    .login-card input:focus { border-color: #818cf8; }

    .login-card button {
      width: 100%;
      padding: 0.7rem;
      background: #818cf8;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .login-card button:hover { background: #6366f1; }

    .login-error {
      color: #f87171;
      font-size: 0.82rem;
      margin-top: 0.5rem;
      display: none;
    }

    /* ── Main layout ── */
    .app {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      background: #16213e;
      border-right: 1px solid #2d3561;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-section {
      padding: 1rem;
      border-bottom: 1px solid #2d3561;
    }

    .sidebar-section h3 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #475569;
      margin-bottom: 0.6rem;
    }

    .room-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 0.88rem;
      cursor: pointer;
      margin-bottom: 0.2rem;
      transition: all 0.15s;
    }

    .room-btn:hover { background: #1a1d2e; color: #e2e8f0; }
    .room-btn.active { background: #2d3561; color: #818cf8; font-weight: 600; }
    .room-btn .room-count {
      float: right;
      font-size: 0.72rem;
      background: #2d3561;
      padding: 0.1rem 0.4rem;
      border-radius: 10px;
      color: #64748b;
    }

    .user-list { flex: 1; overflow-y: auto; }

    .user-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .user-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      flex-shrink: 0;
    }

    .user-item.me { color: #818cf8; font-weight: 600; }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid #2d3561;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .chat-header h2 { font-size: 1rem; font-weight: 700; }
    .chat-header .room-desc { font-size: 0.8rem; color: #64748b; }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 72%;
    }

    .msg.me { align-self: flex-end; align-items: flex-end; }
    .msg.other { align-self: flex-start; }
    .msg.system { align-self: center; max-width: 100%; }

    .msg-meta {
      font-size: 0.72rem;
      color: #475569;
      margin-bottom: 0.2rem;
    }

    .msg.me .msg-meta { text-align: right; }

    .msg-bubble {
      padding: 0.55rem 0.9rem;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg.me .msg-bubble {
      background: #4f46e5;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.other .msg-bubble {
      background: #1e293b;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .msg.system .msg-bubble {
      background: transparent;
      color: #475569;
      font-size: 0.8rem;
      font-style: italic;
      padding: 0.2rem 0.5rem;
    }

    /* ── Input ── */
    .input-area {
      padding: 1rem 1.5rem;
      border-top: 1px solid #2d3561;
      display: flex;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    #msg-input {
      flex: 1;
      padding: 0.7rem 1rem;
      background: #1e293b;
      border: 1px solid #2d3561;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s;
      font-family: inherit;
    }

    #msg-input:focus { border-color: #818cf8; }
    #msg-input:disabled { opacity: 0.4; }

    #send-btn {
      padding: 0.7rem 1.3rem;
      background: #818cf8;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send-btn:hover { background: #6366f1; }
    #send-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2d3561; border-radius: 3px; }
  </style>
</head>
<body>

<!-- Login overlay -->
<div id="login-overlay">
  <div class="login-card">
    <h2>💬 MojoChat</h2>
    <p>Choose a username to start chatting</p>
    <input type="text" id="username-input"
           placeholder="Your username"
           maxlength="20" autofocus>
    <button onclick="joinChat()">Join Chat →</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- App -->
<header>
  <h1>💬 Mojo<span>Chat</span></h1>
  <div class="header-info" id="header-info">Not connected</div>
</header>

<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <h3>Rooms</h3>
      <button class="room-btn active" id="room-general"
              onclick="switchRoom('general')">
        # general <span class="room-count" id="count-general">0</span>
      </button>
      <button class="room-btn" id="room-tech"
              onclick="switchRoom('tech')">
        # tech <span class="room-count" id="count-tech">0</span>
      </button>
      <button class="room-btn" id="room-random"
              onclick="switchRoom('random')">
        # random <span class="room-count" id="count-random">0</span>
      </button>
    </div>

    <div class="sidebar-section" style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
      <h3>Online — <span id="online-count">0</span></h3>
      <div class="user-list" id="user-list"></div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-area">
    <div class="chat-header">
      <div>
        <h2 id="room-title"># general</h2>
        <div class="room-desc" id="room-desc">General discussion</div>
      </div>
    </div>

    <div id="messages"></div>

    <div class="input-area">
      <input type="text" id="msg-input"
             placeholder="Message #general..."
             maxlength="500" disabled>
      <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
    </div>
  </div>
</div>

<script>
  const ROOMS = {
    general: { label: '# general', desc: 'General discussion' },
    tech   : { label: '# tech',    desc: 'Tech talk, Mojo, Python...' },
    random : { label: '# random',  desc: 'Anything goes!' }
  };

  let socket       = null;
  let myUsername   = '';
  let currentRoom  = 'general';

  // ── Login ─────────────────────────────────────────────────────── //
  function joinChat() {
    const input = document.getElementById('username-input');
    const name  = input.value.trim();
    const err   = document.getElementById('login-error');

    if (name.length < 2) {
      err.textContent = 'Username must be at least 2 characters.';
      err.style.display = 'block';
      return;
    }

    if (!/^[a-zA-Z0-9_]+$/.test(name)) {
      err.textContent = 'Letters, numbers and underscore only.';
      err.style.display = 'block';
      return;
    }

    myUsername = name;
    connectSocket();
  }

  document.getElementById('username-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') joinChat();
  });

  // ── Socket ────────────────────────────────────────────────────── //
  function connectSocket() {
    socket = io();

    socket.on('connect', () => {
      socket.emit('join', { username: myUsername, room: currentRoom });
    });

    socket.on('joined', (data) => {
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('msg-input').disabled  = false;
      document.getElementById('send-btn').disabled   = false;
      document.getElementById('header-info').textContent =
        `Logged in as ${myUsername}`;
      // Load history
      data.history.forEach(m => appendMessage(m, false));
      scrollToBottom();
    });

    socket.on('username_taken', () => {
      const err = document.getElementById('login-error');
      err.textContent = 'Username already taken in this room.';
      err.style.display = 'block';
      socket.disconnect();
      socket = null;
    });

    socket.on('message', (msg) => {
      appendMessage(msg, true);
    });

    socket.on('system', (data) => {
      appendSystem(data.text);
    });

    socket.on('room_users', (data) => {
      updateUserList(data.users);
      // Update room counts
      Object.keys(data.counts).forEach(room => {
        const el = document.getElementById('count-' + room);
        if (el) el.textContent = data.counts[room];
      });
      document.getElementById('online-count').textContent =
        data.users.length;
    });

    socket.on('disconnect', () => {
      appendSystem('Disconnected from server.');
      document.getElementById('header-info').textContent = 'Disconnected';
    });
  }

  // ── Rooms ─────────────────────────────────────────────────────── //
  function switchRoom(room) {
    if (room === currentRoom || !socket) return;

    // Update UI
    document.getElementById('room-' + currentRoom).classList.remove('active');
    document.getElementById('room-' + room).classList.add('active');
    document.getElementById('room-title').textContent = ROOMS[room].label;
    document.getElementById('room-desc').textContent  = ROOMS[room].desc;
    document.getElementById('msg-input').placeholder  =
      `Message ${ROOMS[room].label}...`;
    document.getElementById('messages').innerHTML = '';

    const prevRoom = currentRoom;
    currentRoom = room;
    socket.emit('switch_room', { prev_room: prevRoom, new_room: room });
  }

  // ── Messages ──────────────────────────────────────────────────── //
  function sendMessage() {
    const input = document.getElementById('msg-input');
    const text  = input.value.trim();
    if (!text || !socket) return;

    socket.emit('message', { room: currentRoom, text: text });
    input.value = '';
    input.focus();
  }

  document.getElementById('msg-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function appendMessage(msg, animate) {
    const container = document.getElementById('messages');
    const isMe      = msg.username === myUsername;

    const div  = document.createElement('div');
    div.className = 'msg ' + (isMe ? 'me' : 'other');
    if (animate) div.style.animation = 'none';

    div.innerHTML = `
      <div class="msg-meta">${escHtml(msg.username)} · ${msg.time}</div>
      <div class="msg-bubble">${escHtml(msg.text)}</div>
    `;

    container.appendChild(div);
    scrollToBottom();
  }

  function appendSystem(text) {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg system';
    div.innerHTML = `<div class="msg-bubble">${escHtml(text)}</div>`;
    container.appendChild(div);
    scrollToBottom();
  }

  function updateUserList(users) {
    const list = document.getElementById('user-list');
    list.innerHTML = users.map(u => `
      <div class="user-item ${u === myUsername ? 'me' : ''}">
        <div class="user-dot"></div>
        ${escHtml(u)}${u === myUsername ? ' (you)' : ''}
      </div>
    `).join('');
  }

  function scrollToBottom() {
    const msgs = document.getElementById('messages');
    msgs.scrollTop = msgs.scrollHeight;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;')
              .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
